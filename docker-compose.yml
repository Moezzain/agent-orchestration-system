name: agent-orchestration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # AOF persistence: broker messages and working memory survive a container restart
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chromadb:
    # keep server major.minor aligned with the python client in backend/pyproject
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    entrypoint: ["sh", "/entrypoint-api.sh"]
    volumes:
      - ./docker/entrypoint-api.sh:/entrypoint-api.sh:ro
      - workspace:/workspace
    ports:
      - "8000:8000"
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      WORKSPACE_DIR: /workspace
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LLM_CHEAP_MODE: ${LLM_CHEAP_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command:
      [
        "celery",
        "-A",
        "orchestrator.worker.celery_app",
        "worker",
        "--pool=solo",
        "--loglevel=info",
      ]
    environment: *backend-env
    volumes:
      - workspace:/workspace
      # code-execution sandbox: worker drives the HOST docker daemon (documented
      # privilege tradeoff — see tools/builtin/code_exec.py threat model)
      - /var/run/docker.sock:/var/run/docker.sock
    user: root # socket access; sandbox containers themselves run as nobody
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  chroma-data:
  workspace:
